# Satellite Rrs at the HPLC samples of Task 2 (PETRIMED: SOLA, BBMO, MOLA), to compare the pigments
# of the Task 1 models with HPLC.
#
#   python task1/scripts/hplc_matchups.py task1/configs/hplc_matchups.yaml
#
# A copernicus-matchup data config, plus `stations_config`, `output_root` and `compare_on`, read by
# the script, which also uses the cubes of station_matchups.py (station_cubes). The cubes of the
# products below are those of the Task 1 satellite matchups: 3 x 3 pixels and +-1 day, kept when
# more than 20% of the cube has data, each band floored at its 1% quantile of positive values, then
# ln. Only the windows are downloaded, from the remote products.

stations_config: task1/configs/station_matchups.yaml   # station coordinates
output_root: task1/data/hplc_matchups
compare_on: [station_cubes, glo_4km]   # scored also on the samples these share (med_1km has few)

target:
  path: samples.csv                 # written by the script
  target_column: [Chl_a, Chl_b, Chl_C2, Fucoxanthin, 19HF, 19BF, Diadinoxanthin, Alloxanthin,
                  Zeaxanthin, bb_Carotene, Peridinine]
  keep_missing_targets: true
  include_spatial_metadata: false
  include_day_metadata: false
  include_cyclic_day_metadata: false

products:
  - name: glo_4km                   # the product the Task 1 satellite models were fine-tuned with
    dataset_ids: [cmems_obs-oc_glo_bgc-reflectance_my_l3-multi-4km_P1D]
    feature_group: optics
    variables: [RRS412, RRS443, RRS490, RRS555, RRS670]
    matchup: {lat_window: 0.06, lon_window: 0.06}      # 3 x 3 pixels of 1/24 degree
  - name: med_1km                   # the product of the Task 4 record
    dataset_ids: [cmems_obs-oc_med_bgc-reflectance_my_l3-multi-1km_P1D]
    feature_group: optics
    variables: [RRS412, RRS443, RRS490, RRS555, RRS670]
    matchup: {lat_window: 0.015, lon_window: 0.019}    # 3 x 3 pixels of 0.0101 x 0.0128 degrees

matchup:
  time_window_days: 1
  time_threshold_days: 1
  lat_threshold: 0.1
  lon_threshold: 0.1
  require_full_time_window: true

preprocess:
  positive_quantile: 0.01           # over all cubes, pixels and days of a product, as Task 1
  log_products: true
  add_cloud_land_masks: true
  fillna: null                      # keep the gaps: the average skips them
  min_valid_ratio: 0.2
